name: PixelPet checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go build -o bin/pixelpet ./cmd/pet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check offline rhythm timing arithmetic (not gameplay)
        run: node --test ../scripts/evaluate-rhythm.test.mjs
      - name: Check isolated rhythm lab protocol and HTTP (no gameplay integration)
        run: node --test ../prototypes/rhythm/*.test.mjs
      - run: pnpm test
      - run: pnpm build
      - name: Check runtime cache separation in temporary builds
        run: node ../scripts/check-build-cache.mjs
